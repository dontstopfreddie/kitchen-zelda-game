<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Quest - A Zelda-like Adventure</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #e0e0e0;
  flex-direction: column;
}
canvas {
  border: 3px solid #e94560;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#ui {
  width: 640px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
}
#room-name {
  font-size: 18px;
  color: #e94560;
  font-weight: bold;
}
#item-count {
  font-size: 14px;
  color: #0f3460;
  background: #e94560;
  padding: 2px 10px;
  border-radius: 4px;
}
#inventory-bar {
  width: 640px;
  background: #16213e;
  border: 2px solid #0f3460;
  padding: 6px 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 40px;
  border-radius: 4px;
}
#inventory-bar span {
  font-size: 12px;
  color: #888;
}
.inv-item {
  background: #0f3460;
  color: #e94560;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: bold;
}
.inv-item.returned {
  background: #2d6a4f;
  color: #b7e4c7;
}
#message {
  width: 640px;
  text-align: center;
  min-height: 24px;
  font-size: 14px;
  color: #ffd166;
  padding: 4px;
}
#instructions {
  width: 640px;
  text-align: center;
  font-size: 11px;
  color: #555;
  margin-top: 8px;
}
</style>
</head>
<body>
<div id="ui">
  <span id="room-name">Kitchen</span>
  <span id="item-count">Items: 0/6</span>
</div>
<canvas id="game" width="640" height="480"></canvas>
<div id="inventory-bar"><span>Inventory: (empty)</span></div>
<div id="message"></div>
<div id="instructions">WASD / Arrow Keys to move &bull; Walk into items to pick them up &bull; Return items to the kitchen counter</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE = 32;
const COLS = 20;
const ROWS = 15;

// ── Colors ──
const C = {
  floor: '#c9b99a',
  wall: '#5c4033',
  wallTop: '#7a5c47',
  door: '#2d6a4f',
  doorLocked: '#e94560',
  player: '#3498db',
  playerOutline: '#2471a3',
  item: '#ffd166',
  itemGlow: '#ffec99',
  block: '#8d6e63',
  blockDone: '#4caf50',
  sw: '#ff6b6b',
  switchOn: '#51cf66',
  key: '#ffd700',
  counter: '#d4a373',
  counterTop: '#e6c9a0',
  water: '#3b82f6',
  waterDeep: '#2563eb',
  grass: '#6a994e',
  grassDark: '#4a7c3f',
  dirt: '#a67c52',
  stone: '#8a8a8a',
  stoneDark: '#6a6a6a',
  wood: '#b08968',
  carpet: '#9b2226',
  chest: '#d4a373',
};

// ── Tile types ──
const T = {
  FLOOR: 0, WALL: 1, DOOR: 2, ITEM: 3, BLOCK: 4, SWITCH: 5,
  KEY: 6, COUNTER: 7, LOCKED_DOOR: 8, WATER: 9, GRASS: 10,
  DIRT: 11, STONE: 12, WOOD: 13, CARPET: 14, CHEST: 15,
};

// ── Kitchen items to collect ──
const KITCHEN_ITEMS = [
  { name: 'Spatula', icon: '🍳', room: 'garden', x: 15, y: 3 },
  { name: 'Pan', icon: '🥘', room: 'basement', x: 4, y: 11 },
  { name: 'Knife', icon: '🔪', room: 'attic', x: 16, y: 2 },
  { name: 'Whisk', icon: '🥄', room: 'dining', x: 14, y: 7 },
  { name: 'Ladle', icon: '🥣', room: 'garden', x: 3, y: 11 },
  { name: 'Rolling Pin', icon: '📌', room: 'basement', x: 15, y: 4 },
];

// ── Room definitions ──
function makeGrid(fill) {
  const g = [];
  for (let y = 0; y < ROWS; y++) {
    g[y] = [];
    for (let x = 0; x < COLS; x++) g[y][x] = fill;
  }
  return g;
}

function addWalls(grid) {
  for (let x = 0; x < COLS; x++) { grid[0][x] = T.WALL; grid[ROWS-1][x] = T.WALL; }
  for (let y = 0; y < ROWS; y++) { grid[y][0] = T.WALL; grid[y][COLS-1] = T.WALL; }
}

function createKitchen() {
  const g = makeGrid(T.FLOOR);
  addWalls(g);
  // Kitchen counter (return items here)
  for (let x = 3; x <= 8; x++) { g[2][x] = T.COUNTER; }
  // Table
  for (let x = 10; x <= 13; x++) { g[7][x] = T.WOOD; g[8][x] = T.WOOD; }
  // Some decor walls
  for (let y = 3; y <= 5; y++) g[y][14] = T.WALL;
  // Doors
  g[ROWS-1][10] = T.DOOR; // south to garden
  g[7][0] = T.DOOR;       // west to basement
  g[7][COLS-1] = T.DOOR;  // east to dining
  g[0][10] = T.DOOR;      // north to attic
  return g;
}

function createGarden() {
  const g = makeGrid(T.GRASS);
  addWalls(g);
  // Paths
  for (let y = 1; y < ROWS-1; y++) { g[y][10] = T.DIRT; g[y][9] = T.DIRT; }
  for (let x = 1; x < COLS-1; x++) { g[7][x] = T.DIRT; }
  // Pond
  for (let y = 4; y <= 6; y++) for (let x = 5; x <= 7; x++) g[y][x] = T.WATER;
  // Pushable block puzzle - push block onto switch to reveal chest
  g[9][6] = T.BLOCK;
  g[9][8] = T.SWITCH;
  // Trees (walls)
  g[2][2] = T.WALL; g[2][3] = T.WALL;
  g[3][17] = T.WALL; g[4][17] = T.WALL;
  g[11][15] = T.WALL; g[12][15] = T.WALL;
  g[11][16] = T.WALL;
  // Door back to kitchen (north)
  g[0][10] = T.DOOR;
  return g;
}

function createBasement() {
  const g = makeGrid(T.STONE);
  addWalls(g);
  // Dark corridors
  for (let y = 2; y <= 5; y++) g[y][6] = T.WALL;
  for (let y = 2; y <= 5; y++) g[y][12] = T.WALL;
  for (let x = 6; x <= 12; x++) g[5][x] = T.WALL;
  g[3][6] = T.STONE; // gap in wall
  // Key for locked door
  g[3][3] = T.KEY;
  // Locked door inside
  g[5][9] = T.LOCKED_DOOR;
  // Push block puzzle
  g[8][10] = T.BLOCK;
  g[8][14] = T.SWITCH;
  // Door back to kitchen (east)
  g[7][COLS-1] = T.DOOR;
  return g;
}

function createAttic() {
  const g = makeGrid(T.WOOD);
  addWalls(g);
  // Beams
  for (let x = 3; x <= 7; x++) g[5][x] = T.WALL;
  for (let x = 12; x <= 17; x++) g[5][x] = T.WALL;
  for (let y = 7; y <= 11; y++) g[y][10] = T.WALL;
  // Carpet area
  for (let y = 7; y <= 9; y++) for (let x = 2; x <= 5; x++) g[y][x] = T.CARPET;
  // Push block puzzle
  g[3][15] = T.BLOCK;
  g[3][18] = T.SWITCH;
  // Key
  g[10][3] = T.KEY;
  // Locked door
  g[5][10] = T.LOCKED_DOOR;
  // Door back to kitchen (south)
  g[ROWS-1][10] = T.DOOR;
  return g;
}

function createDining() {
  const g = makeGrid(T.FLOOR);
  addWalls(g);
  // Big table
  for (let y = 4; y <= 9; y++) for (let x = 7; x <= 12; x++) g[y][x] = T.WOOD;
  // Carpet under table area
  for (let y = 3; y <= 10; y++) for (let x = 6; x <= 13; x++) {
    if (g[y][x] === T.FLOOR) g[y][x] = T.CARPET;
  }
  // Shelves
  for (let x = 2; x <= 4; x++) g[2][x] = T.WALL;
  for (let x = 15; x <= 17; x++) g[2][x] = T.WALL;
  // Push block
  g[7][3] = T.BLOCK;
  g[7][5] = T.SWITCH;
  // Key for bonus area
  g[12][17] = T.KEY;
  g[2][9] = T.LOCKED_DOOR;
  // Door back to kitchen (west)
  g[7][0] = T.DOOR;
  return g;
}

// ── Room data ──
const rooms = {
  kitchen:   { grid: createKitchen(),  name: 'Kitchen' },
  garden:    { grid: createGarden(),   name: 'Garden' },
  basement:  { grid: createBasement(), name: 'Basement' },
  attic:     { grid: createAttic(),    name: 'Attic' },
  dining:    { grid: createDining(),   name: 'Dining Room' },
};

// ── Door connections ──
const doors = {
  kitchen:  [
    { x: 10, y: ROWS-1, to: 'garden',   tx: 10, ty: 1 },
    { x: 0,  y: 7,      to: 'basement',  tx: COLS-2, ty: 7 },
    { x: COLS-1, y: 7,  to: 'dining',    tx: 1, ty: 7 },
    { x: 10, y: 0,      to: 'attic',     tx: 10, ty: ROWS-2 },
  ],
  garden:   [{ x: 10, y: 0, to: 'kitchen', tx: 10, ty: ROWS-2 }],
  basement: [{ x: COLS-1, y: 7, to: 'kitchen', tx: 1, ty: 7 }],
  attic:    [{ x: 10, y: ROWS-1, to: 'kitchen', tx: 10, ty: 1 }],
  dining:   [{ x: 0, y: 7, to: 'kitchen', tx: COLS-2, ty: 7 }],
};

// ── Game state ──
const state = {
  room: 'kitchen',
  px: 10, py: 10,
  dir: 0, // 0=down,1=up,2=left,3=right
  inventory: [],
  returned: [],
  keys: {},       // keys[room] = count
  solvedSwitches: {},  // solvedSwitches[room+x+y] = true
  message: '',
  messageTimer: 0,
  won: false,
  animFrame: 0,
  walkFrame: 0,
  moving: false,
};

// ── Place kitchen items on their room grids ──
KITCHEN_ITEMS.forEach(item => {
  if (!item.collected) {
    rooms[item.room].grid[item.y][item.x] = T.ITEM;
  }
});

// ── Input ──
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ── Helper ──
function showMessage(msg, duration = 120) {
  state.message = msg;
  state.messageTimer = duration;
}

function getKey(room) {
  if (!state.keys[room]) state.keys[room] = 0;
  state.keys[room]++;
  showMessage('Found a key! 🔑');
}

function switchId(room, x, y) { return `${room}_${x}_${y}`; }

function isSolid(room, x, y) {
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
  const tile = rooms[room].grid[y][x];
  return tile === T.WALL || tile === T.COUNTER || tile === T.WATER ||
         tile === T.LOCKED_DOOR || tile === T.WOOD;
}

function tryPushBlock(room, bx, by, dx, dy) {
  const nx = bx + dx, ny = by + dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return false;
  const dest = rooms[room].grid[ny][nx];
  if (dest !== T.FLOOR && dest !== T.SWITCH && dest !== T.GRASS &&
      dest !== T.STONE && dest !== T.WOOD && dest !== T.CARPET &&
      dest !== T.DIRT) return false;

  const grid = rooms[room].grid;
  // Check if landing on switch
  if (dest === T.SWITCH) {
    grid[by][bx] = T.FLOOR;
    grid[ny][nx] = T.BLOCK; // block sits on switch
    const sid = switchId(room, nx, ny);
    state.solvedSwitches[sid] = true;
    showMessage('Click! The block activated a switch! ✨');
    // Unlock any locked doors in this room
    for (let yy = 0; yy < ROWS; yy++) {
      for (let xx = 0; xx < COLS; xx++) {
        if (grid[yy][xx] === T.LOCKED_DOOR) {
          grid[yy][xx] = T.DOOR;
          // Add a door connection if needed
          // Check if door connection already exists
          const existingDoor = doors[room]?.find(d => d.x === xx && d.y === yy);
          if (!existingDoor) {
            // The unlocked door leads to a hidden area within the same room
            // Just open the path
          }
        }
      }
    }
    return true;
  }

  // Normal push
  grid[by][bx] = getFloorType(room);
  grid[ny][nx] = T.BLOCK;
  return true;
}

function getFloorType(room) {
  if (room === 'garden') return T.GRASS;
  if (room === 'basement') return T.STONE;
  if (room === 'attic') return T.WOOD;
  return T.FLOOR;
}

// ── Movement with cooldown ──
let moveCooldown = 0;
const MOVE_DELAY = 8;

function update() {
  state.animFrame++;

  if (state.won) return;

  if (state.messageTimer > 0) state.messageTimer--;

  if (moveCooldown > 0) { moveCooldown--; return; }

  let dx = 0, dy = 0;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) { dy = -1; state.dir = 1; }
  else if (keys['ArrowDown'] || keys['s'] || keys['S']) { dy = 1; state.dir = 0; }
  else if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx = -1; state.dir = 2; }
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx = 1; state.dir = 3; }

  if (dx === 0 && dy === 0) { state.moving = false; return; }
  state.moving = true;
  state.walkFrame++;

  const nx = state.px + dx, ny = state.py + dy;
  const room = state.room;
  const grid = rooms[room].grid;

  // Check door transitions
  const doorConn = doors[room]?.find(d => d.x === nx && d.y === ny);
  if (doorConn && grid[ny][nx] === T.DOOR) {
    state.room = doorConn.to;
    state.px = doorConn.tx;
    state.py = doorConn.ty;
    moveCooldown = MOVE_DELAY + 5;
    return;
  }

  // Check block push
  if (grid[ny]?.[nx] === T.BLOCK) {
    if (tryPushBlock(room, nx, ny, dx, dy)) {
      moveCooldown = MOVE_DELAY + 4;
    }
    return;
  }

  // Check item pickup
  if (grid[ny]?.[nx] === T.ITEM) {
    const item = KITCHEN_ITEMS.find(i => i.room === room && i.x === nx && i.y === ny && !i.collected);
    if (item) {
      item.collected = true;
      state.inventory.push(item);
      grid[ny][nx] = getFloorType(room);
      showMessage(`Found the ${item.name}! ${item.icon} Bring it to the kitchen counter!`);
    }
  }

  // Check key pickup
  if (grid[ny]?.[nx] === T.KEY) {
    grid[ny][nx] = getFloorType(room);
    getKey(room);
  }

  // Check locked door with key
  if (grid[ny]?.[nx] === T.LOCKED_DOOR) {
    if (state.keys[room] && state.keys[room] > 0) {
      state.keys[room]--;
      grid[ny][nx] = T.DOOR;
      showMessage('Used a key! Door unlocked! 🔓');
      moveCooldown = MOVE_DELAY;
      return;
    } else {
      showMessage('This door is locked. Find a key! 🔒');
      moveCooldown = MOVE_DELAY;
      return;
    }
  }

  // Check counter (return items)
  if (grid[ny]?.[nx] === T.COUNTER && room === 'kitchen') {
    const unreturned = state.inventory.filter(i => !state.returned.includes(i.name));
    if (unreturned.length > 0) {
      unreturned.forEach(i => state.returned.push(i.name));
      if (state.returned.length >= KITCHEN_ITEMS.length) {
        state.won = true;
        showMessage('🎉 You returned all the kitchen items! You WIN! 🎉', 9999);
      } else {
        showMessage(`Returned ${unreturned.map(i=>i.icon).join('')} to the counter! (${state.returned.length}/${KITCHEN_ITEMS.length})`);
      }
    } else if (state.returned.length >= KITCHEN_ITEMS.length) {
      // already won
    } else {
      showMessage('The kitchen counter. Bring items here!');
    }
    moveCooldown = MOVE_DELAY;
    return;
  }

  // Normal movement
  if (!isSolid(room, nx, ny)) {
    state.px = nx;
    state.py = ny;
    moveCooldown = MOVE_DELAY;
  }
}

// ── Drawing ──
function drawTile(x, y, tile, room) {
  const px = x * TILE, py = y * TILE;

  switch(tile) {
    case T.FLOOR:
      ctx.fillStyle = C.floor;
      ctx.fillRect(px, py, TILE, TILE);
      // subtle tile pattern
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(px, py, TILE, 1);
      ctx.fillRect(px, py, 1, TILE);
      break;
    case T.WALL:
      ctx.fillStyle = C.wall;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = C.wallTop;
      ctx.fillRect(px, py, TILE, TILE/2);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(px, py + TILE - 2, TILE, 2);
      break;
    case T.DOOR:
      ctx.fillStyle = C.door;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#40916c';
      ctx.fillRect(px+4, py+4, TILE-8, TILE-8);
      // door handle
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(px+TILE-10, py+TILE/2-2, 4, 4);
      break;
    case T.LOCKED_DOOR:
      ctx.fillStyle = C.doorLocked;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#c1121f';
      ctx.fillRect(px+4, py+4, TILE-8, TILE-8);
      // lock
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(px+TILE/2-3, py+TILE/2-3, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(px+TILE/2-1, py+TILE/2, 2, 3);
      break;
    case T.ITEM: {
      // Draw floor first
      ctx.fillStyle = getFloorColor(room);
      ctx.fillRect(px, py, TILE, TILE);
      // Glowing item
      var glow = Math.sin(state.animFrame * 0.1) * 0.3 + 0.7;
      ctx.fillStyle = C.itemGlow;
      ctx.globalAlpha = glow * 0.3;
      ctx.fillRect(px-2, py-2, TILE+4, TILE+4);
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.item;
      ctx.fillRect(px+6, py+6, TILE-12, TILE-12);
      ctx.fillStyle = '#fff';
      ctx.fillRect(px+10, py+8, 4, 4);
      // sparkle
      ctx.fillStyle = '#fff';
      var sx2 = px + 4 + Math.sin(state.animFrame*0.15)*3;
      var sy2 = py + 4 + Math.cos(state.animFrame*0.15)*3;
      ctx.fillRect(sx2, sy2, 2, 2);
      break;
    }
    case T.BLOCK: {
      ctx.fillStyle = getFloorColor(room);
      ctx.fillRect(px, py, TILE, TILE);
      // Check if on a solved switch
      var sid = switchId(state.room, x, y);
      ctx.fillStyle = state.solvedSwitches[sid] ? C.blockDone : C.block;
      ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(px+2, py+2, TILE-4, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(px+2, py+TILE-6, TILE-4, 4);
      // cross pattern
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(px+TILE/2-1, py+4, 2, TILE-8);
      ctx.fillRect(px+4, py+TILE/2-1, TILE-8, 2);
      break;
    }
    case T.SWITCH:
      ctx.fillStyle = getFloorColor(room);
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = C.sw;
      ctx.fillRect(px+8, py+8, TILE-16, TILE-16);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(px+10, py+10, TILE-20, 2);
      break;
    case T.KEY: {
      ctx.fillStyle = getFloorColor(room);
      ctx.fillRect(px, py, TILE, TILE);
      var kb = Math.sin(state.animFrame * 0.08) * 2;
      ctx.fillStyle = C.key;
      ctx.fillRect(px+10, py+6+kb, 12, 8);
      ctx.fillRect(px+8, py+8+kb, 6, 4);
      ctx.fillStyle = '#b8860b';
      ctx.fillRect(px+18, py+12+kb, 4, 8);
      ctx.fillRect(px+16, py+18+kb, 3, 3);
      break;
    }
    case T.COUNTER:
      ctx.fillStyle = C.counter;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = C.counterTop;
      ctx.fillRect(px, py, TILE, TILE/2 + 4);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(px, py+TILE/2+3, TILE, 2);
      break;
    case T.WATER: {
      ctx.fillStyle = C.water;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = C.waterDeep;
      var wo = Math.sin(state.animFrame*0.05 + x + y) * 3;
      ctx.fillRect(px+4+wo, py+8, 12, 3);
      ctx.fillRect(px+8-wo, py+18, 10, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(px+6+wo, py+6, 6, 2);
      break;
    }
    case T.GRASS:
      ctx.fillStyle = C.grass;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = C.grassDark;
      ctx.fillRect(px+4, py+8, 2, 6);
      ctx.fillRect(px+14, py+4, 2, 5);
      ctx.fillRect(px+24, py+12, 2, 5);
      break;
    case T.DIRT:
      ctx.fillStyle = C.dirt;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(px+6, py+10, 3, 3);
      ctx.fillRect(px+18, py+5, 2, 2);
      break;
    case T.STONE:
      ctx.fillStyle = C.stone;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = C.stoneDark;
      ctx.fillRect(px, py, TILE, 1);
      ctx.fillRect(px, py, 1, TILE);
      ctx.fillRect(px+TILE/2, py, 1, TILE);
      ctx.fillRect(px, py+TILE/2, TILE, 1);
      break;
    case T.WOOD:
      ctx.fillStyle = C.wood;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      for (let i = 0; i < TILE; i += 6) ctx.fillRect(px, py+i, TILE, 1);
      break;
    case T.CARPET:
      ctx.fillStyle = C.carpet;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
      break;
  }
}

function getFloorColor(room) {
  if (room === 'garden') return C.grass;
  if (room === 'basement') return C.stone;
  if (room === 'attic') return C.wood;
  return C.floor;
}

function drawPlayer() {
  const px = state.px * TILE, py = state.py * TILE;
  const bob = state.moving ? Math.sin(state.walkFrame * 0.5) * 2 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(px+4, py+TILE-4, TILE-8, 4);

  // Body
  ctx.fillStyle = C.player;
  ctx.fillRect(px+6, py+6+bob, TILE-12, TILE-10);

  // Head
  ctx.fillStyle = '#f4d03f';
  ctx.fillRect(px+8, py+2+bob, TILE-16, 10);

  // Eyes based on direction
  ctx.fillStyle = '#000';
  switch(state.dir) {
    case 0: // down
      ctx.fillRect(px+10, py+8+bob, 3, 3);
      ctx.fillRect(px+18, py+8+bob, 3, 3);
      break;
    case 1: // up
      ctx.fillRect(px+10, py+4+bob, 3, 3);
      ctx.fillRect(px+18, py+4+bob, 3, 3);
      break;
    case 2: // left
      ctx.fillRect(px+8, py+6+bob, 3, 3);
      ctx.fillRect(px+8, py+6+bob, 3, 3);
      break;
    case 3: // right
      ctx.fillRect(px+20, py+6+bob, 3, 3);
      break;
  }

  // Hat (chef hat!)
  ctx.fillStyle = '#fff';
  ctx.fillRect(px+6, py-2+bob, TILE-12, 6);
  ctx.fillRect(px+8, py-6+bob, TILE-16, 6);
  ctx.fillRect(px+10, py-8+bob, TILE-20, 4);

  // Outline details
  ctx.fillStyle = C.playerOutline;
  ctx.fillRect(px+6, py+TILE-6+bob, TILE-12, 2);
}

function drawHUD() {
  // Update DOM elements
  document.getElementById('room-name').textContent = rooms[state.room].name;
  document.getElementById('item-count').textContent = `Items: ${state.returned.length}/${KITCHEN_ITEMS.length}`;

  // Inventory bar
  const bar = document.getElementById('inventory-bar');
  if (state.inventory.length === 0) {
    bar.innerHTML = '<span>Inventory: (empty)</span>';
  } else {
    bar.innerHTML = state.inventory.map(item => {
      const returned = state.returned.includes(item.name);
      return `<div class="inv-item ${returned ? 'returned' : ''}">${item.icon} ${item.name}${returned ? ' ✓' : ''}</div>`;
    }).join('');
  }

  // Keys display
  const roomKeys = state.keys[state.room] || 0;
  if (roomKeys > 0) {
    bar.innerHTML += `<div class="inv-item" style="background:#5c4033;color:#ffd700;">🔑 x${roomKeys}</div>`;
  }

  // Message
  const msgEl = document.getElementById('message');
  if (state.messageTimer > 0) {
    msgEl.textContent = state.message;
    msgEl.style.opacity = Math.min(1, state.messageTimer / 20);
  } else {
    msgEl.textContent = '';
  }
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 48px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText('YOU WIN!', canvas.width/2, canvas.height/2 - 40);

  ctx.fillStyle = '#e0e0e0';
  ctx.font = '20px "Courier New"';
  ctx.fillText('All kitchen items returned!', canvas.width/2, canvas.height/2 + 10);

  ctx.font = '16px "Courier New"';
  ctx.fillText('The kitchen is complete again.', canvas.width/2, canvas.height/2 + 50);

  // Animated items
  KITCHEN_ITEMS.forEach((item, i) => {
    const angle = state.animFrame * 0.02 + i * (Math.PI*2/KITCHEN_ITEMS.length);
    const ix = canvas.width/2 + Math.cos(angle) * 100 - 10;
    const iy = canvas.height/2 + 80 + Math.sin(angle) * 20;
    ctx.font = '24px serif';
    ctx.fillText(item.icon, ix, iy);
  });
  ctx.textAlign = 'left';
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const room = state.room;
  const grid = rooms[room].grid;

  // Draw tiles
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      drawTile(x, y, grid[y][x], room);
    }
  }

  // Draw player
  drawPlayer();

  // Draw win screen overlay
  if (state.won) drawWinScreen();

  // HUD
  drawHUD();
}

// ── Game loop ──
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// Start message
showMessage('Welcome to Kitchen Quest! Find all 6 kitchen items and return them to the counter!', 180);
try { gameLoop(); } catch(e) { document.getElementById('message').textContent = 'Error: ' + e.message; }
</script>
